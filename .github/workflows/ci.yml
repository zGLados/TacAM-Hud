# Typecheck, tests and build for every push and pull request – on Linux and
# Windows, because some behavior (console hints, paths) differs per platform.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as the release build (see release.yml): Node 22, npm 11.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
