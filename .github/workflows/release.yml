# Builds the Windows installer when a GitHub release is published and
# attaches it to that release. Tag format: v1.2.3 or v1.2.3-beta.1 (pre-release = beta
# channel); it must match the version in package.json.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Node >= 22.12 (Electron 43). npm 11 because npm 10 (bundled with Node 22) crashes
      # resolving Vitest's peer dependencies ("Cannot read properties of null (reading 'edgesOut')").
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.19.1

      - run: npm ci

      # The version lives in package.json (set in the release commit, see docs/development.md);
      # a tag that does not match would ship an app reporting the wrong version.
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION - bump the version first (npm run version:set -- <version>)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build installer
        working-directory: apps/desktop
        run: npm run build && npx electron-builder --win nsis --publish never

      # Code signing via SignPath Foundation (free for open source, see README → Code signing
      # policy). Runs once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN exist; until then releases stay unsigned. Each request has to be
      # approved in SignPath (manual approval per release), the job waits for it.
      - name: Upload unsigned installer for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'TacAM-Hud' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/signed

      # The signed installer replaces the unsigned one; latest.yml / beta.yml and the
      # .blockmap are recomputed, otherwise the in-app updater rejects the download.
      - name: Use signed installer and refresh update files
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        working-directory: apps/desktop
        run: |
          Move-Item -Force release/signed/*.exe release/
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) is not validly signed: $($sig.Status)" }
            Write-Host "$($_.Name): signed by $($sig.SignerCertificate.Subject)"
          }
          node scripts/refresh-update-info.mjs release

      - name: Upload installer and update metadata to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml for stable updates, beta.yml / alpha.yml for the beta channel (Settings → App updates)
        run: |
          cd apps/desktop/release
          files=(*.exe *.exe.blockmap latest.yml)
          for channel in beta.yml alpha.yml; do [ -f "$channel" ] && files+=("$channel"); done
          gh release upload "$TAG" "${files[@]}" --clobber
