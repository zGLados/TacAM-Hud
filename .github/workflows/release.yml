# Builds the Windows installer when a GitHub release is published and
# attaches it to that release. Tag format: v1.2.3 or v1.2.3-beta.1 (pre-release = beta
# channel); it must match the version in package.json.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Node >= 22.12 (Electron 43). npm 11 because npm 10 (bundled with Node 22) crashes
      # resolving Vitest's peer dependencies ("Cannot read properties of null (reading 'edgesOut')").
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.19.1

      - run: npm ci

      # The version lives in package.json (set in the release commit, see docs/development.md);
      # a tag that does not match would ship an app reporting the wrong version.
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION - bump the version first (npm run version:set -- <version>)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build installer
        working-directory: apps/desktop
        run: npm run build && npx electron-builder --win nsis --publish never

      - name: Upload installer and update metadata to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml for stable updates, beta.yml / alpha.yml for the beta channel (Settings → App updates)
        run: |
          cd apps/desktop/release
          files=(*.exe *.exe.blockmap latest.yml)
          for channel in beta.yml alpha.yml; do [ -f "$channel" ] && files+=("$channel"); done
          gh release upload "$TAG" "${files[@]}" --clobber
